services:
  mysql:
    image: mysql:8.4
    container_name: food-ordering-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: food_ordering
      MYSQL_USER: food_user
      MYSQL_PASSWORD: food_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
volumes:
  mysql_data:
